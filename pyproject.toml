[project]
name = "image-style-transfer"
version = "0.1.0"
description = "Three style-transfer methods (Magenta, Gatys VGG19, StyTr²) behind a Gradio UI and CLI."
requires-python = ">=3.10,<3.13"
dependencies = [
    "gradio==5.34.1",
    "tensorflow==2.19.0",
    "tensorflow_hub==0.16.1",
    "numpy==2.1.3",
    "pillow==11.2.1",
    "scipy==1.15.3",
    "setuptools==80.9.0",
    "requests",
]

[project.optional-dependencies]
cpu = [
    "torch==2.10.0",
    "torchvision==0.25.0",
]
cuda = [
    "torch==2.10.0",
    "torchvision==0.25.0",
]
metal = [
    "tensorflow-metal ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
